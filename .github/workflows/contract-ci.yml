name: Contract CI
on:
  push:
    paths: ['contracts/**']
  pull_request:
    paths: ['contracts/**']

# Cancel in-progress runs for the same branch/ref when a new push arrives.
# Rust/Cargo builds are slow — redundant parallel runs are proportionally
# costly, so cancelling stale runs as early as possible saves significant
# CI minutes on rapid iterative pushes.
concurrency:
  group: contract-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('**/Cargo.lock') }}-${{ runner.os }}-contracts

      - name: Build contracts (WASM)
        run: cargo build --target wasm32-unknown-unknown --release
        working-directory: contracts

      - name: Run contract tests
        run: cargo test --workspace --tests
        working-directory: contracts
