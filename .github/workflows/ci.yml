name: Backend CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm ci

      - name: Lint
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm ci

      - name: Install sqlite3 CLI
        run: sudo apt-get update && sudo apt-get install -y sqlite3

      - name: Validate env example
        run: node scripts/validate-env.js

      - name: Type check (src)
        run: node node_modules/.bin/tsc --noEmit

      - name: Type check (scripts)
        run: node node_modules/.bin/tsc --noEmit -p tsconfig.scripts.json

      - name: Run tests with coverage
        # node_modules/.bin/jest is unreliable here: jest and jest-cli are
        # both hoisted to top-level node_modules and both declare a bin
        # literally named "jest", so npm can't deterministically symlink it.
        # Invoke jest's own bin script directly to sidestep the collision.
        run: node node_modules/jest/bin/jest.js --runInBand --forceExit --coverage --coverageReporters=text --coverageReporters=lcov
        env:
          CONTRACT_ID: CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABSC4

      # Coverage is only representative once, so upload it from the Node
      # version .nvmrc pins (20) to keep this identical to the prior
      # single-version behavior instead of uploading/overwriting 3x.
      - name: Upload coverage to Codecov
        if: matrix.node-version == 20
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage/lcov.info
          fail_ci_if_error: false

      - name: Upload coverage report as artifact
        if: matrix.node-version == 20
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - run: npm ci

      # Dev-only tooling (eslint, jest, etc.) never ships to production, so
      # only production dependencies gate the build. See CONTRIBUTING.md's
      # "CI Enforcement & Exception Process" for what to do when this fails
      # on a legitimately unpatchable finding.
      - name: Audit production dependencies (high/critical)
        run: npm audit --omit=dev --audit-level=high
  contracts:
    name: Soroban Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build contracts (WASM)
        working-directory: contracts
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Test contracts (host target)
        working-directory: contracts
        run: cargo test --target x86_64-unknown-linux-gnu
