name: Backend CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Install sqlite3 CLI
        run: sudo apt-get update && sudo apt-get install -y sqlite3

      - name: Validate env example
        run: node scripts/validate-env.js

      - name: Type check (src)
        run: node node_modules/.bin/tsc --noEmit

      - name: Type check (scripts)
        run: node node_modules/.bin/tsc --noEmit -p tsconfig.scripts.json

      - name: Run tests with coverage
        # node_modules/.bin/jest is unreliable here: jest and jest-cli are
        # both hoisted to top-level node_modules and both declare a bin
        # literally named "jest", so npm can't deterministically symlink it.
        # Invoke via the npm script which calls jest's own bin directly.
        run: npm run test:coverage -- --forceExit --coverageReporters=text --coverageReporters=lcov
        env:
          CONTRACT_ID: CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABSC4

      # Coverage is only representative once, so upload it from the Node
      # version .nvmrc pins (20) to keep this identical to the prior
      # single-version behavior instead of uploading/overwriting 3x.
      - name: Upload coverage to Codecov
        if: matrix.node-version == 20
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage/lcov.info
          fail_ci_if_error: false

      - name: Upload coverage report as artifact
        if: matrix.node-version == 20
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  # Runs the same suite as `test` above but against a real PostgreSQL service
  # container with DB_DRIVER=postgres, so the Postgres driver path (#1014)
  # can never silently regress. Excludes only the test files that exercise
  # the events/indexer_state, admin-multisig (pending_admin_actions), and
  # webhook-delivery subsystems — those are explicitly out of scope for
  # #1014 (owned by separate issues) and still use SQLite's raw getDb()
  # handle by design, so they're expected to fail under DB_DRIVER=postgres
  # rather than being converted here.
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scout_off_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - name: Type check (src)
        run: node node_modules/.bin/tsc --noEmit

      - name: Run test suite against DB_DRIVER=postgres
        run: >
          node node_modules/jest/bin/jest.js --runInBand
          --testPathIgnorePatterns="/node_modules/"
          --testPathIgnorePatterns="tests/controllers/webhookAdminController.test.ts"
          --testPathIgnorePatterns="tests/db/backfill.test.ts"
          --testPathIgnorePatterns="tests/db/sqlInjectionRegression.test.ts"
          --testPathIgnorePatterns="tests/e2e/milestonePromotion.e2e.test.ts"
          --testPathIgnorePatterns="tests/e2e/scoutUnlock.e2e.test.ts"
          --testPathIgnorePatterns="tests/routes/adminAuditTrail.test.ts"
          --testPathIgnorePatterns="tests/routes/adminExport.test.ts"
          --testPathIgnorePatterns="tests/routes/adminPagination.test.ts"
          --testPathIgnorePatterns="tests/routes/adminQuerySchema.test.ts"
          --testPathIgnorePatterns="tests/routes/exportStreaming.test.ts"
          --testPathIgnorePatterns="tests/routes/reindex.test.ts"
          --testPathIgnorePatterns="tests/services/indexer.test.ts"
          --testPathIgnorePatterns="tests/services/indexerDispatch.test.ts"
          --testPathIgnorePatterns="tests/services/tierPromotion.test.ts"
          --testPathIgnorePatterns="tests/services/webhooks.test.ts"
        env:
          DB_DRIVER: postgres
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/scout_off_ci
          POSTGRES_TEST_URL: postgres://postgres:postgres@localhost:5432/scout_off_ci
          CONTRACT_ID: CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABSC4

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - run: npm ci

      # Dev-only tooling (eslint, jest, etc.) never ships to production, so
      # only production dependencies gate the build. See CONTRIBUTING.md's
      # "CI Enforcement & Exception Process" for what to do when this fails
      # on a legitimately unpatchable finding.
      - name: Audit production dependencies (high/critical)
        run: npm audit --omit=dev --audit-level=high
  contracts:
    name: Soroban Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build contracts (WASM)
        working-directory: contracts
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Test contracts (host target)
        working-directory: contracts
        run: cargo test --target x86_64-unknown-linux-gnu
